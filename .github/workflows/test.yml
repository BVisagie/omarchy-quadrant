name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          check-latest: true
      - name: Manifest parses
        run: jq -e '.id and .kinds and .entryPoints.barWidget and .barWidget.schema' manifest.json
      - name: Model tests
        run: node --test tests/lib/*.test.js
      - name: qmllint gate
        # Needs qmllint plus an Omarchy shell to resolve qs.* imports; the
        # script skips cleanly elsewhere, so this documents the local gate
        # and fails the moment a runner with the shell is attached.
        run: bash tests/qmllint.sh

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install ruff
        run: python3 -m pip install --quiet ruff
      - name: Lint python helpers
        run: |
          ruff check --no-cache scripts/gpu-drm scripts/qproc.py scripts/helper-envelope.py scripts/panel-action.py scripts/hardware-info.py scripts/amd-runtime-power.py tests/py tests/bench-bar.py tests/qs/*.py
          python3 -m py_compile scripts/gpu-drm scripts/qproc.py scripts/helper-envelope.py scripts/panel-action.py scripts/hardware-info.py scripts/amd-runtime-power.py tests/bench-bar.py tests/qs/*.py
      - name: Python helper tests
        run: python3 -m unittest discover -s tests/py -t . -v

  scripts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        awk: [mawk, gawk]
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck jq iproute2 procps pciutils "${{ matrix.awk }}"
      - name: shellcheck
        run: |
          for f in scripts/*; do
            [[ -f $f ]] || continue
            head=$(head -n1 "$f")
            case $head in
              *python*) continue ;;
            esac
            shellcheck -x "$f"
          done
      - name: bash syntax
        run: |
          for f in scripts/*; do
            [[ -f $f ]] || continue
            head=$(head -n1 "$f")
            case $head in
              *python*) continue ;;
            esac
            bash -n "$f"
          done
      - name: PlainText grep check (${{ matrix.awk }})
        # Quote the whole command so GitHub Actions YAML stays valid; the
        # block scalar still lets the shell expand the QML globs.
        run: |
          ${{ matrix.awk }} -f tests/check-plaintext.awk $(find . -path ./.git -prune -o -name '*.qml' -print | sort)
      - name: Namespaced shell imports (${{ matrix.awk }})
        run: |
          ${{ matrix.awk }} -f tests/check-qml-imports.awk $(find . -path ./.git -prune -o -name '*.qml' -print | sort)
      - name: Script smoke tests (${{ matrix.awk }})
        run: |
          set -e
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/tmp/quadrant-ci}"
          mkdir -p "$XDG_RUNTIME_DIR"
          export QUADRANT_AWK="${{ matrix.awk }}"
          ./scripts/process-sample 3 | jq -e '.ok == true and .metric == "procs" and (.payload | fromjson | .procs > 0)'
          sleep 1
          ./scripts/process-sample 3 --window 30 | jq -e '.ok == true and (.payload | fromjson | (.cpu | length) > 0)'
          ./scripts/process-net eth0 | jq -e '.ok == true'
          ./scripts/gpu-stats list | jq -e '.ok == true'
          for mode in list power sample; do
            python3 scripts/hardware-info.py "$mode" | jq -e --arg mode "$mode" '.ok == true and .mode == $mode and (.sensors | type == "array")'
          done
          bash tests/intel-freq-paths.sh
          ./scripts/system-info | jq -e '.ok == true and .cpu and .mem and .host'
          ./scripts/disk-info | jq -e '.ok == true and .disks and .dfPayload and (.backing | type == "object")'
          # failure path: bad input must produce an ok:false envelope
          if ./scripts/process-sample nope | jq -e '.ok == false' >/dev/null; then
            echo "failure envelope OK"
          else
            echo "process-sample did not report failure correctly"
            exit 1
          fi
          QUADRANT_STREAM_TICKS=2 ./scripts/quadrant-stream 500 | while IFS= read -r line; do
            echo "$line" | jq -e '.v == 1 and .cpu and .mem and .net and has("cf") and has("disk")'
          done
      - name: Stream fork budget (${{ matrix.awk }})
        run: bash tests/stream-forks.sh
      - name: Store smoke test (skips without quickshell)
        run: bash tests/qs-smoke.sh
      - name: Device identity wiring (skips without quickshell)
        run: bash tests/qs-device-identity.sh
      - name: Shared process lifecycle (skips without quickshell)
        run: bash tests/qs-process-lifecycle.sh
      - name: Process UI and keyboard (skips without quickshell and shell imports)
        run: bash tests/qs-process-ui.sh
      - name: Panel controls and history (skips without quickshell and shell imports)
        run: bash tests/qs-panel-ui.sh
      - name: Graph layouts, hover and settings (skips without quickshell and shell imports)
        run: bash tests/qs-graph-ui.sh
      - name: Bar trends, ordering and shared service (skips without quickshell and shell imports)
        run: bash tests/qs-bar-ui.sh
      - name: AMD visibility and runtime PM lifecycle
        run: bash tests/qs-gpu-power.sh
      - name: GPU control startup, late history, sleep polling and cancellation
        run: bash tests/qs-gpu-review.sh
      - name: Local copy/open actions (skips without quickshell and shell imports)
        run: bash tests/qs-actions-ui.sh
      - name: Hardware details and shared collector (skips without quickshell and shell imports)
        run: bash tests/qs-hardware-ui.sh
